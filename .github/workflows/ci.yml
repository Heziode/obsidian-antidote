name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same rules the Obsidian team runs against submitted plugins.
      - run: npm run test:lint

      - run: npm run test:prettier

      - run: npm run test:types

      - run: npm run test:spelling

      - run: npm run build
