name: Release

# Obsidian downloads the release assets of the tag matching manifest.json, so a
# release is cut by pushing that tag.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  # Both are needed to sign the build provenance of the published assets.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches the manifest
        run: |
          version="$(jq -r .version manifest.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      # Lets anyone verify the assets were built from this repository, at this
      # commit, by this workflow.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      # Only the three files Obsidian downloads: anything else is dead weight
      # users never receive.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="dist/main.js dist/manifest.json dist/styles.css"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$GITHUB_REF_NAME" $assets --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              $assets
          fi
